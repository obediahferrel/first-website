<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Extraction Tool</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .container {
      display: flex;
      gap: 20px;
    }

    .box {
      background: white;
      padding: 15px;
      border-radius: 8px;
      width: 50%;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      font-size: 14px;
      margin-top: 10px;
    }

    button {
      margin-top: 10px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h1>Extraction Tool</h1>

<div class="container">

  <!-- INPUT -->
  <div class="box">
    <h3>Input</h3>
    <textarea id="inputBox" placeholder="Paste input here..."></textarea>
    <button onclick="processInput()">Extract</button>
  </div>

  <!-- OUTPUT -->
  <div class="box">
    <h3>Output</h3>
    <textarea id="outputBox" readonly></textarea>
    <button onclick="copyOutput()">Copy</button>
  </div>

</div>

<script>
function processInput() {
  const text = document.getElementById("inputBox").value;

  // ---- SIMPLE EXTRACTION EXAMPLE ----
  // (Replace or expand this later)

  const size = text.match(/\b(LARGE|SMALL|MEDIUM|HUGE|TINY)\b/)?.[0] || "";
  const color = text.match(/\b(BLUE|GREEN|RED|YELLOW)\b/)?.[0] || "";
  const timeRaw = text.match(/\/(\d{6})\//)?.[1] || "";
  const country = text.match(/1X (.*?)-STATIC/)?.[1] || "";
  const coords = text.match(/\/(\d+[NS])\s+(\d+[EW])\//);

  const time = timeRaw ? timeRaw + "Z" : "";
  const convertedTime = time ? time.slice(2) : "";
  const coordinates = coords ? coords[1] + coords[2] : "";

  const output =
`SIZE: ${size}
COLOR: ${color}
COUNTRY: ${country}
TIME: ${time}
CONVERTED TIME: ${convertedTime}
COORDINATES: ${coordinates}`;

  document.getElementById("outputBox").value = output;
}

function copyOutput() {
  const box = document.getElementById("outputBox");
  box.select();
  document.execCommand("copy");
}
</script>

</body>
</html>
